name: 안드로이드 APK 만들기

on:
  push:
    branches: [main]
    paths: ['tablet-app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tablet-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tablet-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: 서명 키 넣기
        working-directory: tablet-app/android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > app/release.jks
          else
            echo "::warning::서명 키 비밀값이 없어 임시 키로 서명해요. 다음 버전은 덮어 설치가 안 될 수 있어요."
            keytool -genkeypair -keystore app/release.jks -alias screenwriter -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass temporary -keypass temporary -dname "CN=Screenwriter temp"
            echo "KEYSTORE_PASSWORD=temporary" >> "$GITHUB_ENV"
          fi
      - name: APK 빌드
        working-directory: tablet-app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          SECRET_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: screenwriter
        run: |
          export KEYSTORE_PASSWORD="${SECRET_PW:-$KEYSTORE_PASSWORD}"
          chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk "Screenwriter-v${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: tablet-app/*.apk
      - name: 릴리스로 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 시나리오 작업실 v1.0.${{ github.run_number }}
          body: |
            갤럭시 탭에서 아래 .apk 파일을 눌러 받은 뒤 열면 설치돼요.
            이전 버전 위에 그대로 덮어 설치되고, 작품은 지워지지 않아요.
            커밋: ${{ github.sha }}
          files: tablet-app/*.apk
          make_latest: true
