name: 안드로이드 APK 만들기

on:
  push:
    branches: [main]
    paths: ['tablet-app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tablet-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tablet-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: 서명 키 넣기
        working-directory: tablet-app/android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "ANDROID_KEYSTORE_BASE64 비밀값이 없어요"; exit 1; fi
          echo "$KS" | base64 -d > app/release.jks
      - name: APK 빌드
        working-directory: tablet-app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: screenwriter
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk "시나리오작업실-v${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: tablet-app/*.apk
      - name: 릴리스로 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 시나리오 작업실 v1.0.${{ github.run_number }}
          body: |
            갤럭시 탭에서 아래 .apk 파일을 눌러 받은 뒤 열면 설치돼요.
            이전 버전 위에 그대로 덮어 설치되고, 작품은 지워지지 않아요.
            커밋: ${{ github.sha }}
          files: tablet-app/*.apk
          make_latest: true
